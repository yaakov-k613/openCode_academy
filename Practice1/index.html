<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCode Academy</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <h2>Second Level Heading</h2>
    <p>New Paragraph</p>
     <!-- Simple button container -->
  <div class="button-container">
    <!-- The login button itself -->
    <button class="login-btn">Log in with GitHub</button>
  </div>
  <img src="./img/image1.jpg" alt="Jew learning Torah">
  <!-- Main container just to center the button on the page -->
<div class="page-wrapper">
  <!-- The clickable Twitter-style button -->
  <a class="twitter-button" href="https://twitter.com" target="_blank">
    <!-- Small SVG icon that looks like the Twitter/X logo -->
    <span class="twitter-icon" aria-hidden="true">
      <!-- Simple X-style icon using SVG paths -->
      <svg viewBox="0 0 24 24">
        <!-- Draws the X shape -->
        <path d="M4 4 L20 20 M20 4 L4 20" />
      </svg>
    </span>
    <!-- Text label shown next to the icon -->
    <span class="twitter-label">Follow on X</span>
  </a>
</div>


</body>
</html>
