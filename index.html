<!DOCTYPE html> <!-- Defines this as an HTML5 document -->
<html lang="en"> <!-- Sets the page language to English -->
<head>
  <meta charset="UTF-8"> <!-- Ensures proper text display -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes it mobile-friendly -->
  <title>BarkerBox – 15% Off for New Subscribers</title> <!-- Title shown in browser tab -->
  <link rel="stylesheet" href="./styles_form.css"> <!-- Connects the external CSS file -->
</head>

<body>

  <!-- Main page container for centering and layout -->
  <div class="container">
    <!-- Product heading -->
    <h1>BarkerBox – Get 15% Off!</h1>
    <!-- Short product description -->
    <p class="description">
      Treat your furry friend to a monthly box filled with unique, playful, and durable toys!  
      Join thousands of happy pups discovering new favorites every month.
    </p>
    <!-- Signup form for the discount -->
    <form class="signup-form">
      <!-- Email input field -->
      <input type="email" placeholder="Enter your email" required>
      <!-- Submit button -->
      <button type="submit">Get My 15% Off</button>
    </form>
  </div>
</body>
</html>
